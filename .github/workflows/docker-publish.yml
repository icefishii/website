name: Build and Publish Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: vars
        run: echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute daily increment tag
        id: daily_tag
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const y = now.getUTCFullYear();
            const m = String(now.getUTCMonth() + 1).padStart(2, '0');
            const d = String(now.getUTCDate()).padStart(2, '0');
            const dayPrefix = `${y}-${m}-${d}`;

            const workflow_id = context.workflow;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let page = 1;
            let allRuns = [];
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                per_page: 100,
                page
              });

              allRuns = allRuns.concat(data.workflow_runs || []);

              if (!data.workflow_runs || data.workflow_runs.length < 100) break;
              page += 1;
            }

            const sameDayRuns = allRuns.filter((run) => {
              const created = run.created_at || '';
              return created.startsWith(dayPrefix) && run.run_number <= context.runNumber;
            });

            const buildIndex = sameDayRuns.length || 1;
            const tag = `${y}.${m}.${d}.${buildIndex}`;

            core.setOutput('tag', tag);
            core.info(`Daily build tag: ${tag}`);

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.daily_tag.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}